# ====================================================================
# FEAS 2.0 - NVIDIA GPU Acceleration Override for Docker Compose
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# ====================================================================

services:
  feas-all:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
