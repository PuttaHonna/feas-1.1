services:
  # FEAS 2.0 FastAPI Backend Web Service
  - type: web
    name: feas-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt"
    startCommand: "sh -c 'cd FEAS && exec python -m uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-10000} --workers 1'"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: PYTHONPATH
        value: FEAS
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Cloudflare R2 Zero-Egress Cloud Storage (10 GB Free Tier)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "feas-videos"
      - key: R2_AUTO_CLEAN_LOCAL
        value: "true"
