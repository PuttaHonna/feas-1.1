services:
  # FEAS 2.0 FastAPI Backend Web Service
  - type: web
    name: feas-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python run.py api"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
